spring.application.name=imageSaver


##Database connection setting

spring.datasource.url=jdbc:mysql://localhost:3306/image_saver
spring.datasource.username=root
spring.datasource.password=root


##jpa and hibernate setting

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Directory where files will be uploaded
file.upload-dir=./uploads

#enabling multipart upload
spring.servlet.multipart.enabled=true

#max file size
spring.servlet.multipart.file-size-threshold=10MB
server.tomcat.max-part-count=20

# 1. Spring Framework Multipart Limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# 2. Embedded Tomcat Server Limits (The Missing Piece)
# -1 removes the limit so Tomcat doesn't cut the connection early
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=500MB








